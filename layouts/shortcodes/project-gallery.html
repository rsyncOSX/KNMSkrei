<div class="project-gallery">
  {{ range hugo.Data.project_photos }}
  <figure>
    <a href="{{ printf "images/skrei/%s.jpg" .id | relURL }}" aria-label="{{ printf "Open larger photograph: %s" .caption }}">
      <img src="{{ printf "images/skrei/%s-thumb.jpg" .id | relURL }}" alt="{{ .caption }}" loading="lazy" decoding="async" width="640" height="480">
    </a>
    <figcaption>{{ .caption }} <span class="project-gallery-reference">{{ .id }}</span></figcaption>
  </figure>
  {{ end }}
</div>
<dialog class="project-gallery-dialog" aria-label="Enlarged photograph">
  <button type="button" class="project-gallery-dialog__close" autofocus>Close <span aria-hidden="true">&times;</span></button>
  <figure>
    <img alt="">
    <figcaption></figcaption>
  </figure>
</dialog>
{{ if not (.Page.Scratch.Get "project-gallery-script") }}
  {{ .Page.Scratch.Set "project-gallery-script" true }}
  {{ $script := resources.Get "js/project-gallery.js" | fingerprint }}
  <script src="{{ $script.RelPermalink }}" integrity="{{ $script.Data.Integrity }}" defer></script>
{{ end }}
